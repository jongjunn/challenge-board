<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>박종준 챌린지 보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{
  --desk:#BDBDBD; --win:#E2E2E1; --panel:#EAEAE9; --card:#F1F1F0; --well:#DCDCDB;
  --ink:#1E1E1E; --ink-2:#3A3A3A; --muted:#7B7B7A; --faint:#A3A3A2; --line:#D2D2D1;
  --rail:#2A2A2B; --rail-2:#3A3A3B;
  --ok:#3E9C6A; --ok-bg:#D8EBDD; --warn:#A97C1E; --warn-bg:#F0E6CC; --dead:#C2483B; --dead-bg:#F2D9D5; --off:#8A8A8A; --off-bg:#E0E0DF;
  --hi:inset 0 1px 0 rgba(255,255,255,.85), 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06);
  --sunk:inset 0 1px 2px rgba(0,0,0,.08), inset 0 -1px 0 rgba(255,255,255,.7);
  --sans:"Inter","Pretendard",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.num{font-family:"Inter",sans-serif;font-variant-numeric:tabular-nums}

/* window */
.desk{min-height:100%;padding:24px;display:flex}
.win{flex:1;display:grid;grid-template-columns:68px 300px 1fr;gap:12px;background:var(--win);border-radius:30px;padding:14px;box-shadow:0 30px 80px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.7);min-height:calc(100vh - 48px)}

/* rail */
.railwrap{display:flex;flex-direction:column;gap:12px;background:rgba(255,255,255,.35);border-radius:20px;padding:6px;box-shadow:var(--hi)}
.rail{background:linear-gradient(180deg,#333334,#232324);border-radius:16px;padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.12)}
.rail .mark{color:#EDEDED;font-size:22px;line-height:1;padding:6px 0 12px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:4px;width:36px;text-align:center}
.rail a{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#CFCFCF}
.rail a:hover{background:rgba(255,255,255,.08)}
.rail a.on{background:linear-gradient(180deg,#58585A,#3E3E40);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 2px 6px rgba(0,0,0,.35)}
.rail svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.vlabel{flex:1;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:.18em;color:var(--faint);font-family:"Inter";border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:6px 8px}
.gear{align-self:center;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(180deg,#333334,#232324);color:#DDD;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.gear svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7}

/* sidebar */
.side{background:var(--panel);border-radius:22px;padding:16px 16px 14px;display:flex;flex-direction:column;box-shadow:var(--hi);overflow:auto;min-height:0}
.lights{display:flex;gap:7px;align-items:center;margin-bottom:18px}
.lights i{width:11px;height:11px;border-radius:50%;box-shadow:inset 0 -1px 2px rgba(0,0,0,.2)}
.lights i:nth-child(1){background:#E8A3A6}.lights i:nth-child(2){background:#E9D29A}.lights i:nth-child(3){background:#A9D9C4}
.lights .sp{flex:1}
.lights button{border:1px solid var(--line);background:none;width:20px;height:14px;border-radius:4px;padding:0}
.me{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.avatar{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5A5A5C,#141414);display:grid;place-items:center;color:#fff;font-weight:600;font-size:17px;box-shadow:0 0 0 3px #fff,0 4px 10px rgba(0,0,0,.2)}
.me b{display:block;font-weight:500;font-size:15px}
.me small{color:var(--faint);font-size:12.5px}
.grp{font-size:12.5px;color:var(--faint);margin:6px 0 6px 4px}
.nav{display:flex;flex-direction:column;gap:2px;padding-bottom:12px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;font-size:14.5px;color:var(--ink-2)}
.nav a:hover{background:rgba(255,255,255,.45)}
.nav a.on{background:linear-gradient(180deg,#F6F6F5,#EDEDEC);box-shadow:var(--hi);color:var(--ink)}
.nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;color:var(--muted);background:var(--well);border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px;box-shadow:var(--sunk)}
.docs-h{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--well);border-radius:12px;padding:9px 12px;box-shadow:var(--sunk);margin:6px 0 8px}
.search svg{width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:1.8}
.search input{border:0;background:none;outline:none;flex:1;font:inherit;font-size:13.5px;color:var(--ink)}
.tree{background:rgba(255,255,255,.35);border-radius:14px;padding:8px;box-shadow:var(--hi);font-size:13.5px}
.tree .f{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:9px;color:var(--ink-2)}
.tree .f.sub{padding-left:28px;font-size:13px}
.tree .f.sub::before{content:"";width:1px;height:22px;background:var(--line);position:absolute;margin-left:-14px}
.tree a.f:hover{background:rgba(255,255,255,.55)}
.tree a.f.on{background:var(--well);box-shadow:var(--sunk);color:var(--ink)}
.tree svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;flex:none}
.tree .cnt{margin-left:auto;font-size:11px;color:var(--muted);background:var(--well);border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;box-shadow:var(--sunk)}

/* main */
.main{background:var(--panel);border-radius:22px;padding:30px 32px;box-shadow:var(--hi);overflow:auto;min-width:0;position:relative}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}
.head h1{margin:0;font-weight:500;font-size:30px;letter-spacing:-.01em}
.head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.menu-btn{display:none;border:0;background:var(--card);box-shadow:var(--hi);border-radius:12px;width:40px;height:40px;flex:none}
.menu-btn svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);background:var(--card);border-radius:999px;padding:6px 12px;box-shadow:var(--hi);white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;margin-bottom:34px}
.kpi{display:flex;flex-direction:column;gap:10px}
.kcard{background:linear-gradient(180deg,#F5F5F4,#ECECEB);border-radius:18px;padding:16px 18px 14px;box-shadow:var(--hi);border:1px solid rgba(255,255,255,.7)}
.kcard .t{font-size:15px;color:var(--ink-2)}
.kcard .v{display:flex;align-items:flex-end;gap:10px;margin-top:14px}
.kcard .v b{font-family:"Inter";font-weight:300;font-size:60px;line-height:.9;letter-spacing:-.03em}
.chip{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:7px;background:var(--c-bg,var(--ok-bg));color:var(--c,var(--ok));margin-bottom:6px;white-space:nowrap}
.see{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.4);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--ink-2)}
.see:hover{background:rgba(255,255,255,.7)}

h2{font-weight:500;font-size:26px;margin:0 0 14px;letter-spacing:-.01em}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 0 10px;font-size:15px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.well{background:linear-gradient(180deg,#E4E4E3,#E9E9E8);border-radius:18px;padding:10px;box-shadow:var(--sunk);margin-top:12px}
.row{display:grid;grid-template-columns:44px minmax(0,1.6fr) minmax(0,1.1fr) minmax(0,2fr) 84px;gap:14px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--card);box-shadow:var(--hi);margin:8px 0}
.row:hover{background:#F7F7F6}
.ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(180deg,#3A3A3B,#222);color:#fff;font-weight:600;font-size:13px;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.row b{font-weight:500;font-size:15px;display:block}
.row small{color:var(--muted);font-size:12px}
.mini{display:flex;gap:3px;margin-top:6px}
.mini i{flex:1;height:4px;border-radius:2px;background:var(--well);box-shadow:var(--sunk)}
.mini i.d{background:var(--ink-2);box-shadow:none}.mini i.c{background:var(--faint);box-shadow:none}
.nx{font-size:13px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st{justify-self:end;font-size:12px;font-weight:600;padding:4px 10px;border-radius:8px;background:var(--b);color:var(--c)}
.st.active{--b:var(--ok-bg);--c:var(--ok)}.st.waiting{--b:var(--warn-bg);--c:var(--warn)}.st.dead{--b:var(--dead-bg);--c:var(--dead)}.st.paused{--b:var(--off-bg);--c:var(--off)}.st.done{--b:var(--off-bg);--c:var(--ink-2)}
.empty{padding:40px 10px;text-align:center;color:var(--faint);font-size:13.5px}

/* detail */
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-bottom:14px}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
.box{background:var(--card);border-radius:18px;padding:18px 20px;box-shadow:var(--hi)}
.box h3{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start;padding:8px 0;position:relative}
.step .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--well);box-shadow:var(--sunk);color:var(--muted)}
.step.d .n{background:var(--ink-2);color:#fff;box-shadow:none}
.step.c .n{background:#fff;color:var(--ink);box-shadow:0 0 0 2px var(--ink-2)}
.step.c span{font-weight:600}
.step:not(:last-child)::after{content:"";position:absolute;left:12.5px;top:36px;bottom:-4px;width:1px;background:var(--line)}
dl.kv{display:grid;grid-template-columns:72px 1fr;gap:8px 12px;margin:0;font-size:13.5px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0}
.endcard{background:linear-gradient(180deg,#F6EAE7,#F0E0DC)}
.chart svg{width:100%;height:170px;display:block;overflow:visible}
.chart .ax{font-size:11px;fill:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-weight:500;color:var(--muted);font-size:12px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl tr.me td{font-weight:600}
.pos{color:var(--ok)} .neg{color:var(--dead)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.acts{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2)} .acts li{margin:4px 0}
.kv3{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kv3 div{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--hi)}
.kv3 small{color:var(--muted);font-size:12px} .kv3 b{display:block;font-family:"Inter";font-weight:400;font-size:24px;margin-top:4px}
.scrollx{overflow-x:auto}

/* checklist / log */
.check{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--card);box-shadow:var(--hi);margin:8px 0;font-size:14.5px}
.check i{width:20px;height:20px;border-radius:6px;background:var(--well);box-shadow:var(--sunk);display:grid;place-items:center;font-style:normal;font-size:12px}
.check.done i{background:var(--ink-2);color:#fff;box-shadow:none}
.check.done span{color:var(--faint);text-decoration:line-through}
.bar{height:8px;border-radius:4px;background:var(--well);box-shadow:var(--sunk);overflow:hidden;margin:6px 0 16px}
.bar i{display:block;height:100%;background:var(--ink-2)}
.who{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:7px;background:var(--well);box-shadow:var(--sunk);white-space:nowrap}

/* doc */
.doc{background:var(--card);border-radius:18px;padding:28px 34px;box-shadow:var(--hi);max-width:900px;line-height:1.7}
.doc h1{font-size:26px;font-weight:600;margin:0 0 16px}
.doc h2{font-size:20px;margin:28px 0 10px}
.doc h3{font-size:16px;margin:22px 0 8px}
.doc table{border-collapse:collapse;width:100%;font-size:13px;margin:12px 0;display:block;overflow-x:auto}
.doc th,.doc td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.doc th{background:var(--well)}
.doc blockquote{margin:12px 0;padding:8px 16px;border-left:3px solid var(--ink-2);background:rgba(0,0,0,.03);border-radius:0 10px 10px 0}
.doc code{background:var(--well);padding:1px 5px;border-radius:5px;font-size:12.5px}
.doc pre{background:var(--well);padding:12px 14px;border-radius:12px;overflow-x:auto}
.doc pre code{background:none;padding:0}
.doc a{text-decoration:underline}

/* responsive */
.scrim{display:none}
@media (max-width:1080px){
  .win{grid-template-columns:68px 1fr}
  .side{position:fixed;z-index:20;top:24px;bottom:24px;left:104px;width:300px;transform:translateX(-130%);transition:transform .25s ease}
  body.open .side{transform:none}
  body.open .scrim{display:block;position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.18)}
  .menu-btn{display:grid;place-items:center}
}
@media (max-width:760px){
  .desk{padding:10px}
  .win{grid-template-columns:1fr;padding:10px;border-radius:22px;min-height:calc(100vh - 20px)}
  .railwrap{flex-direction:row;padding:4px}
  .rail{flex-direction:row;padding:0 10px;flex:1;justify-content:space-around}
  .rail .mark{border:0;padding:0;margin:0;width:auto}
  .vlabel{display:none}
  .gear{display:none}
  .rail a{width:36px;height:36px}
  .head{flex-wrap:wrap}
  .head h1{font-size:24px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kcard{padding:14px}
  .kcard .v{flex-wrap:wrap;gap:6px}
  .see{padding:8px 12px;font-size:13px}
  .side{left:10px;right:10px;width:auto;top:10px;bottom:10px}
  .main{padding:20px 16px}
  .row{grid-template-columns:44px 1fr auto}
  .row .c3,.row .c4{display:none}
  .grid2{grid-template-columns:1fr}
  .kcard .v b{font-size:40px}
  .doc{padding:20px}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
</style>
</head>
<body>
<div class="desk"><div class="win">
  <div class="railwrap">
    <nav class="rail" id="rail" aria-label="주요 메뉴"></nav>
    <div class="vlabel">BAKJONGJUN 2026 BOARD</div>
    <a class="gear" href="#/doc/AGENTS.md" title="작업 규칙"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-2.7-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3.5 14H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.1-2.7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 10 3.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg></a>
  </div>
  <aside class="side" id="side" aria-label="탐색"></aside>
  <main class="main" id="main"></main>
</div></div>
<div class="scrim" id="scrim"></div>

<script src="data.js" id="datajs"></script>
<script src="bot.js" onerror="window.BOT=null"></script>
<script>
let B = window.BOARD;
const STN = {active:"진행중", waiting:"대기", paused:"보류", done:"완료", dead:"사망"};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s || "");
const md = s => { const [,m,d] = s.split("-"); return `${+m}.${+d}`; };
const I = {
  home:'<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
  biz:'<rect x="4" y="7" width="16" height="12" rx="2"/><path d="M9 7V5h6v2"/>',
  bot:'<path d="M5 16l4-5 3 3 6-7"/><path d="M15 7h3v3"/>',
  pre:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M8 13l3 3 5-6"/>',
  log:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
  doc:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/>',
  list:'<circle cx="6" cy="7" r="2"/><path d="M10 7h9M6 17h.01M10 17h9M6 12h.01M10 12h9"/>',
  dot:'<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/>',
  wait:'<circle cx="12" cy="12" r="8"/><path d="M12 7v5h4"/>',
  x:'<circle cx="12" cy="12" r="8"/><path d="M9 9l6 6M15 9l-6 6"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  file:'<path d="M7 3h7l5 5v13H7z"/>',
  search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  menu:'<path d="M4 7h16M4 12h16M4 17h16"/>'
};
const svg = (k, cls="") => `<svg viewBox="0 0 24 24" class="${cls}" aria-hidden="true">${I[k]}</svg>`;
const route = () => (location.hash.replace(/^#\/?/, "") || "").split("/").map(decodeURIComponent);
let tab = "all", q = "", docQ = "", botTab = "fut";

/* ---------- shell ---------- */
function renderRail(r){
  const items = [["", "home", "대시보드"], ["projects", "biz", "사업"], ["p/coinbot", "bot", "코인 봇"], ["preseason", "pre", "프리시즌"], ["log", "log", "기록"], ["doc/" + (B.docs?.[0]?.files?.[0]?.path || ""), "doc", "문서"]];
  const cur = r.join("/");
  document.getElementById("rail").innerHTML = `<div class="mark" aria-hidden="true">✳</div>` + items.map(([h, ic, t]) => {
    const on = h === "" ? cur === "" : (h.startsWith("doc/") ? r[0] === "doc" : cur === h || (h === "projects" && r[0] === "status"));
    return `<a href="#/${h}" class="${on ? "on" : ""}" title="${t}" aria-label="${t}">${svg(ic)}</a>`;
  }).join("");
}

function renderSide(r){
  const P = B.projects, cnt = s => P.filter(p => p.status === s).length;
  const cur = r.join("/");
  const link = (h, ic, t, n) => `<a href="#/${h}" class="${cur === h ? "on" : ""}">${svg(ic)}${t}${n != null ? `<span class="cnt num">${n}</span>` : ""}</a>`;
  const docs = (B.docs || []).map(g => {
    const files = g.files.filter(f => !docQ || (f.title + f.path).toLowerCase().includes(docQ.toLowerCase()));
    if (!files.length) return "";
    return `<div class="f">${svg("folder")}${esc(g.folder)}<span class="cnt num">${files.length}</span></div>` +
      files.map(f => `<a class="f sub ${r[0] === "doc" && r.slice(1).join("/") === f.path ? "on" : ""}" href="#/doc/${encodeURI(f.path)}">${svg("file")}${esc(f.title)}</a>`).join("");
  }).join("");
  document.getElementById("side").innerHTML = `
    <div class="lights"><i></i><i></i><i></i><span class="sp"></span><button type="button" aria-label="사이드바 닫기" onclick="document.body.classList.remove('open')"></button></div>
    <div class="me"><div class="avatar">박</div><div><b>${esc(B.meta.channel)} ⌄</b><small>${esc(B.meta.start)} → ${esc(B.meta.goal)}</small></div></div>
    <div class="grp">Projects</div>
    <div class="nav">${link("", "list", "Dashboard", P.length)}${link("projects", "biz", "사업 · 파이프라인")}${link("preseason", "pre", "프리시즌", `${B.preseason.filter(x => x.done).length}/${B.preseason.length}`)}</div>
    <div class="grp">Status</div>
    <div class="nav">${link("status/active", "dot", "진행중", cnt("active"))}${link("status/waiting", "wait", "대기", cnt("waiting"))}${link("status/dead", "x", "사망 선고", cnt("dead"))}</div>
    <div class="grp">History</div>
    <div class="nav">${link("log", "log", "기록", B.log.length)}</div>
    <div class="docs-h"><span class="grp" style="margin:0 0 0 4px">Documents</span></div>
    <label class="search">${svg("search")}<input id="docq" placeholder="Search" value="${esc(docQ)}" aria-label="문서 검색"></label>
    <div class="tree">${docs || `<div class="f" style="color:var(--faint)">없음</div>`}</div>`;
  const inp = document.getElementById("docq");
  inp.oninput = e => { docQ = e.target.value; renderSide(route()); const n = document.getElementById("docq"); n.focus(); n.setSelectionRange(docQ.length, docQ.length); };
}

const head = (t, sub) => `<div class="head"><div style="display:flex;gap:12px;align-items:flex-start">
  <button class="menu-btn" type="button" aria-label="메뉴" onclick="document.body.classList.add('open')">${svg("menu")}</button>
  <div><h1>${t}</h1><p>${sub}</p></div></div><span class="live"><i></i>업데이트 ${esc(B.meta.updated)}</span></div>`;

/* ---------- views ---------- */
function rowsHTML(list){
  if (!list.length) return `<div class="empty">조건에 맞는 항목이 없어요</div>`;
  return list.map(p => {
    const st = p.stages || [], c = Math.min(p.current|0, st.length - 1);
    return `<a class="row" href="#/p/${esc(p.id)}">
      <div class="ico">${esc(p.name.replace(/\s/g, "").slice(0,2))}</div>
      <div><b>${esc(p.name)}</b><small>${esc(p.no)}</small></div>
      <div class="c3"><small class="num">${c+1}/${st.length}</small> <span style="font-size:13px">${esc(st[c] || "")}</span><div class="mini">${st.map((_,j) => `<i class="${j < c ? "d" : j === c ? "c" : ""}"></i>`).join("")}</div></div>
      <div class="nx c4">${esc(p.next)}</div>
      <span class="st ${esc(p.status)}">${STN[p.status] || esc(p.status)}</span></a>`;
  }).join("");
}
function listBlock(fixed){
  const order = {active:0, waiting:1, paused:2, done:3, dead:4};
  const tabs = [["all","전체"],["active","진행중"],["waiting","대기"],["dead","사망 선고"]];
  const t = fixed || tab;
  const list = B.projects.filter(p => (t === "all" || p.status === t) && (!q || (p.name + p.what + p.next).toLowerCase().includes(q.toLowerCase())))
    .sort((a,b) => (order[a.status]??9) - (order[b.status]??9));
  return `${fixed ? "" : `<div class="tabs" role="tablist">${tabs.map(([k,l]) => `<button type="button" role="tab" aria-selected="${t === k}" class="${t === k ? "on" : ""}" data-tab="${k}">${l}</button>`).join("")}</div>`}
    <label class="search">${svg("search")}<input id="q" placeholder="Search" value="${esc(q)}" aria-label="사업 검색"></label>
    <div class="well" id="rows">${rowsHTML(list)}</div>`;
}
function bindList(){
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  const inp = document.getElementById("q");
  if (inp) inp.oninput = e => { q = e.target.value; render(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(q.length, q.length); };
}

function kpi(t, v, chip, href, tone){
  return `<div class="kpi"><div class="kcard"><div class="t">${t}</div><div class="v"><b class="num">${v}</b>${chip ? `<span class="chip" style="${tone || ""}">${chip}</span>` : ""}</div></div>
    <a class="see" href="#/${href}">자세히 보기 <span>→</span></a></div>`;
}
function dashboard(){
  const P = B.projects, live = P.filter(p => p.status === "active" || p.status === "waiting").length, dead = P.filter(p => p.status === "dead").length;
  const pre = B.preseason, n = pre.filter(x => x.done).length;
  let day = "PRE", dchip = "Day 1 미정";
  if (isDate(B.meta.day1)){ const d = Math.round((new Date(new Date().toISOString().slice(0,10)) - new Date(B.meta.day1)) / 864e5); day = d < 0 ? `D-${-d}` : d + 1; dchip = d < 0 ? "Day 1까지" : "/ 365일"; }
  const nw = B.ledger.net_worth;
  return head("Dashboard", `${esc(B.meta.tagline)}`) + `
    <div class="kpis">
      ${kpi("챌린지 일차", day, dchip, "preseason", "--c:var(--muted);--c-bg:var(--well)")}
      ${kpi("순자산", nw == null ? "—" : (nw/1e4).toLocaleString("ko-KR"), nw == null ? "Day 1부터 집계" : "만원", "log", "--c:var(--muted);--c-bg:var(--well)")}
      ${kpi("살아있는 사업", live, `진행 ${P.filter(p => p.status === "active").length}`, "status/active")}
      ${kpi("사망 선고", dead, dead ? "판정 완료" : "", "status/dead", "--c:var(--dead);--c-bg:var(--dead-bg)")}
      ${B.meta.phase === "preseason" ? kpi("프리시즌", `${n}<span style="font-size:28px;color:var(--faint)">/${pre.length}</span>`, `${Math.round(n/pre.length*100)}%`, "preseason", "--c:var(--warn);--c-bg:var(--warn-bg)") : ""}
    </div>
    <h2>사업 · 파이프라인</h2>${listBlock()}`;
}

function chartSVG(s){
  const W = 520, H = 170, vs = s.map(x => x.value), lo = Math.min(...vs), hi = Math.max(...vs), pad = (hi - lo) * .3 || 1;
  const X = i => 30 + i * (W - 50) / (s.length - 1), Y = v => 12 + (H - 40) * (1 - (v - lo + pad) / (hi - lo + 2 * pad));
  const pts = s.map((x,i) => [X(i), Y(x.value)]);
  let d = `M${pts[0]}`; for (let i = 1; i < pts.length; i++){ const [a,b] = pts[i-1], [c,e] = pts[i], m = (a+c)/2; d += ` C${m},${b} ${m},${e} ${c},${e}`; }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="추이 그래프">
    <line x1="20" x2="${W-10}" y1="${pts[0][1]}" y2="${pts[0][1]}" stroke="var(--faint)" stroke-dasharray="3 4"/>
    <path d="${d}" fill="none" stroke="var(--ink-2)" stroke-width="2.2" stroke-linecap="round"/>
    ${pts.map(([x,y],i) => `<circle cx="${x}" cy="${y}" r="${i === pts.length-1 ? 5 : 3}" fill="${i === pts.length-1 ? "var(--ink)" : "var(--card)"}" stroke="var(--ink-2)" stroke-width="1.5"/>`).join("")}
    ${s.map((x,i) => `<text class="ax" x="${X(i)}" y="${H-6}" text-anchor="middle">${md(x.date)}</text>`).join("")}
    <text class="ax" x="${pts[pts.length-1][0]}" y="${pts[pts.length-1][1]-12}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${Math.round(vs[vs.length-1]).toLocaleString()}</text></svg>`;
}
function detail(id){
  const p = B.projects.find(x => x.id === id);
  if (!p) return head("없음", "해당 항목이 없어요") ;
  const st = p.stages || [], c = Math.min(p.current|0, st.length - 1);
  return `<a class="back" href="#/projects">← 사업 · 파이프라인</a>` + head(esc(p.name), `${esc(p.no)} · ${esc(p.what)}`) + `
    <div class="grid2">
      <div style="display:flex;flex-direction:column;gap:14px">
        ${p.series?.length > 1 ? `<div class="box chart"><h3>${esc(p.metric?.label || "추이")} · ${esc(p.metric?.sub || "")}</h3>${chartSVG(p.series)}</div>` : ""}
        <div class="box"><h3>다음 할 일</h3><div style="font-size:15px">${esc(p.next)}</div>${isDate(p.due) ? `<div style="margin-top:8px;color:var(--muted)" class="num">마감 ${md(p.due)}</div>` : ""}</div>
        ${p.card ? `<div class="box"><h3>시작 카드</h3><dl class="kv"><dt>질문</dt><dd>${esc(p.card.question)}</dd><dt>마감</dt><dd>${esc(p.card.deadline)}</dd><dt>사망 조건</dt><dd>${esc(p.card.kill)}</dd></dl></div>` : ""}
        ${p.result ? `<div class="box endcard"><h3>끝 카드 · ${esc(p.result.verdict)}</h3><dl class="kv"><dt>투입</dt><dd>${esc(p.result.spent)} · ${esc(p.result.hours)}</dd><dt>매출</dt><dd>${esc(p.result.revenue)}</dd><dt>이유</dt><dd>${esc(p.result.reason)}</dd></dl></div>` : ""}
      </div>
      <div class="box"><h3>단계 <span class="st ${esc(p.status)}" style="float:right">${STN[p.status] || ""}</span></h3>
        <div class="steps">${st.map((s,i) => `<div class="step ${i < c ? "d" : i === c ? "c" : ""}"><span class="n num">${i < c ? "✓" : i+1}</span><span>${esc(s)}</span></div>`).join("")}</div></div>
    </div>${p.id === "coinbot" && window.BOT ? botPanel() : ""}`;
}
const COLORS = ["#1E1E1E","#3E9C6A","#C2483B","#A97C1E","#4F6BD8","#8E5BD0","#7B7B7A","#D07A2E","#2A9BB0","#B54E8C"];
function multiSVG(lines){
  const all = lines.flatMap(l => l.series.map(x => x.value)), dates = [...new Set(lines.flatMap(l => l.series.map(x => x.date)))].sort();
  if (dates.length < 2) return "";
  const W = 620, H = 220, lo = Math.min(...all), hi = Math.max(...all), pad = (hi - lo) * .1 || 1;
  const X = d => 30 + dates.indexOf(d) * (W - 50) / (dates.length - 1), Y = v => 10 + (H - 40) * (1 - (v - lo + pad) / (hi - lo + 2*pad));
  const tick = Math.max(1, Math.ceil(dates.length / 6));
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="대회 평가금 추이">
    ${lines.map((l,i) => `<polyline fill="none" stroke="${COLORS[i % COLORS.length]}" stroke-width="${l.key === "bot" ? 2.6 : 1.3}" stroke-linejoin="round" points="${l.series.map(x => `${X(x.date)},${Y(x.value)}`).join(" ")}"/>`).join("")}
    ${dates.map((d,i) => i % tick && i !== dates.length-1 ? "" : `<text class="ax" x="${X(d)}" y="${H-6}" text-anchor="middle">${md(d)}</text>`).join("")}</svg>
    <div class="legend">${lines.map((l,i) => `<span><i style="background:${COLORS[i % COLORS.length]}"></i>${esc(l.name)}</span>`).join("")}</div>`;
}
const fmt = v => v == null || v === "" ? "—" : Number(v).toLocaleString("en-US", {maximumFractionDigits: 4});
function botPanel(){
  const T = window.BOT, f = T.futures, s = T.spot, t = T.tournament;
  const tabs = [["fut","데모 선물 봇"],["spot","현물 BTC 봇"],["tour","투자대회"]];
  let body = "";
  if (botTab === "fut"){
    const last = f.series.at(-1)?.value, chg = f.start && last ? (last / f.start - 1) * 100 : null;
    body = `<div class="kv3"><div><small>지갑</small><b>${fmt(last)}</b></div><div><small>시작 대비</small><b class="${chg >= 0 ? "pos" : "neg"}">${chg == null ? "—" : (chg >= 0 ? "+" : "") + chg.toFixed(2) + "%"}</b></div>
      <div><small>보유 포지션</small><b>${f.positions.length}</b></div><div><small>BTC 추세</small><b>${esc(f.btc_votes ?? "—")}/6</b></div></div>
      ${f.series.length > 1 ? `<div class="box chart" style="margin-bottom:14px"><h3>데모 선물 지갑 (USDT) · 마지막 실행 ${esc(f.last)} UTC</h3>${chartSVG(f.series)}</div>` : ""}
      <div class="box scrollx" style="margin-bottom:14px"><h3>지금 들고 있는 포지션</h3><table class="tbl"><tr><th>코인</th><th>방향</th><th class="r">진입가</th><th class="r">손절가</th><th class="r">익절</th><th>진입일</th></tr>
        ${f.positions.map(x => `<tr><td>${esc(x.symbol)}</td><td>${esc(x.side)}</td><td class="r num">${fmt(x.entry)}</td><td class="r num">${fmt(x.stop)}</td><td class="r num">${esc(x.tp)}</td><td class="num">${esc(x.opened ? md(x.opened) : "")}</td></tr>`).join("") || `<tr><td colspan="6" class="empty">포지션 없음</td></tr>`}</table></div>
      <div class="box"><h3>마지막 실행에서 한 일</h3><ul class="acts">${f.actions.map(a => `<li>${esc(a)}</li>`).join("") || "<li>매매 없음</li>"}</ul></div>`;
  } else if (botTab === "spot"){
    const last = s.series.at(-1)?.value, first = s.series[0]?.value;
    body = `<div class="kv3"><div><small>평가금 (USDT)</small><b>${fmt(last)}</b></div><div><small>기록 시작 대비</small><b class="${last >= first ? "pos" : "neg"}">${first ? ((last/first - 1) * 100).toFixed(2) + "%" : "—"}</b></div>
      <div><small>BTC 비중</small><b>${s.weight ? Math.round(s.weight * 100) + "%" : "—"}</b></div><div><small>추세 투표</small><b>${esc(s.votes ?? "—")}/6</b></div></div>
      ${s.series.length > 1 ? `<div class="box chart"><h3>현물 BTC 봇 평가금 · BTC ${fmt(s.btc_price)} · 마지막 ${esc(s.last)} UTC</h3>${chartSVG(s.series)}</div>` : ""}`;
  } else {
    body = `<div class="box chart" style="margin-bottom:14px"><h3>${esc(t.head || "BTC 봇 모의투자 대회")}</h3>${multiSVG(t.lines)}</div>
      <div class="box scrollx"><h3>순위</h3><table class="tbl"><tr><th>#</th><th>봇</th><th class="r">평가금</th><th class="r">수익률</th><th class="r">최대낙폭</th><th class="r">BTC 비중</th><th class="r">매매</th></tr>
        ${t.board.map(b => `<tr class="${b.name.startsWith("①") ? "me" : ""}"><td class="num">${b.rank}</td><td>${esc(b.name)}</td><td class="r num">${esc(b.equity)}</td><td class="r num ${b.ret.startsWith("-") ? "neg" : "pos"}">${esc(b.ret)}</td><td class="r num">${esc(b.mdd)}</td><td class="r num">${esc(b.weight)}</td><td class="r num">${esc(b.trades)}</td></tr>`).join("")}</table></div>`;
  }
  return `<h2 style="margin-top:34px">봇 현황</h2><div class="tabs" role="tablist">${tabs.map(([k,l]) => `<button type="button" role="tab" aria-selected="${botTab === k}" class="${botTab === k ? "on" : ""}" data-bt="${k}">${l}</button>`).join("")}</div>${body}
    <p style="color:var(--faint);font-size:12px;margin-top:12px">데모·모의 계좌 기록 · 투자 조언 아님 · 5분마다 자동 갱신</p>`;
}
function preseason(){
  const pre = B.preseason, n = pre.filter(x => x.done).length;
  return head("프리시즌", "Day 1 전에 끝낼 세팅 · 실적 집계는 Day 1부터") + `
    <div class="bar"><i style="width:${n/pre.length*100}%"></i></div>
    <div class="well">${pre.map(x => `<div class="check ${x.done ? "done" : ""}"><i>${x.done ? "✓" : ""}</i><span>${esc(x.item)}</span></div>`).join("")}</div>
    <p style="color:var(--faint);font-size:12.5px;margin-top:14px">체크는 dashboard/data.js의 preseason에서 done을 true로 바꾸면 반영돼요.</p>`;
}
function log(){
  return head("기록", "누가 언제 무엇을 바꿨나") + `<div class="well">${B.log.map(l => `<div class="check"><span class="num" style="width:44px;color:var(--muted);font-size:13px">${md(l.date)}</span><span class="who">${esc(l.who)}</span><span>${esc(l.text)}</span></div>`).join("")}</div>`;
}
async function doc(path){
  const f = (B.docs || []).flatMap(g => g.files).find(x => x.path === path);
  const main = document.getElementById("main");
  main.innerHTML = head(esc(f?.title || path), esc(path)) + `<div class="doc">불러오는 중…</div>`;
  try {
    const r = await fetch("../" + path.split("/").map(encodeURIComponent).join("/"), {cache:"no-store"});
    if (!r.ok) throw 0;
    const html = window.marked ? marked.parse(await r.text()) : `<pre>${esc(await r.text())}</pre>`;
    if (route().slice(1).join("/") === path) main.querySelector(".doc").innerHTML = html;
  } catch { main.querySelector(".doc").textContent = "문서를 불러오지 못했어요. 프로젝트 폴더에서 서버를 켰는지 확인하세요."; }
}

function render(){
  const r = route(), main = document.getElementById("main");
  renderRail(r); renderSide(r);
  document.body.classList.remove("open");
  if (r[0] === "doc") return doc(r.slice(1).join("/"));
  if (r[0] === "p") main.innerHTML = detail(r[1]);
  else if (r[0] === "projects") main.innerHTML = head("사업 · 파이프라인", "카드를 누르면 단계와 시작·끝 카드를 볼 수 있어요") + listBlock();
  else if (r[0] === "status") main.innerHTML = head(STN[r[1]] || r[1], "상태별 보기") + listBlock(r[1]);
  else if (r[0] === "preseason") main.innerHTML = preseason();
  else if (r[0] === "log") main.innerHTML = log();
  else main.innerHTML = dashboard();
  bindList();
  document.querySelectorAll("[data-bt]").forEach(b => b.onclick = () => { botTab = b.dataset.bt; render(); });
}
window.addEventListener("hashchange", () => { render(); document.getElementById("main").scrollTop = 0; });
document.getElementById("scrim").onclick = () => document.body.classList.remove("open");
render();

/* data.js가 바뀌면 자동 반영 (10초마다 확인) */
setInterval(() => {
  const s = document.createElement("script");
  s.src = "data.js?t=" + Date.now();
  s.onload = () => { const prev = JSON.stringify(B); B = window.BOARD; if (JSON.stringify(B) !== prev && !document.activeElement?.matches("input")) render(); s.remove(); };
  s.onerror = () => s.remove();
  document.head.append(s);
  const b = document.createElement("script");
  b.src = "bot.js?t=" + Date.now();
  b.onload = () => { if (route()[1] === "coinbot") render(); b.remove(); };
  b.onerror = () => b.remove();
  document.head.append(b);
}, 10000);
</script>
